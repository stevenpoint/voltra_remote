; Voltra Remote - BLE remote for the Beyond Power Voltra I
; Target: Waveshare ESP32-S3-Knob-Touch-LCD-1.8 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM)

[platformio]
default_envs = remote

; Flags shared by the release and diagnostic builds.
[common]
build_flags =
    -std=gnu++17
    -Wall
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: pick up include/lv_conf.h, and let generated fonts include "lvgl.h"
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    ; Knob: 0 = Waveshare "bidirectional switch" decoding (default), 1 = quadrature
    -DKNOB_QUADRATURE=0
    -DKNOB_INVERT=0
    ; NimBLE: drop the server/advertising wrapper code, we are central only.
    ; Do not override CONFIG_BT_NIMBLE_MAX_CONNECTIONS here: the Arduino core ships a
    ; precompiled NimBLE host with it fixed at 3, and redefining it only desyncs the
    ; wrapper from the library.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

[env:remote]
; pioarduino = Arduino core 3.x on ESP-IDF 5.x (needed for the QSPI esp_lcd panel IO API)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

lib_deps =
    lvgl/lvgl@^8.4.0
    h2zero/NimBLE-Arduino@^2.2.0

build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    ; Release: no log output over serial (Arduino log_*, NimBLE and LVGL are all silent)
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

; Diagnostic build, for protocol work only: full serial logging, every parameter read and
; write, workout telemetry, and a periodic sweep of the registers listed in
; src/voltra/sweep_params.cpp (tools/gen_sweep_params.py) so snapshots can be diffed.
;   pio run -e remote_diag -t upload
[env:remote_diag]
extends = env:remote
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DVOLTRA_DIAG=1
    ; keep a copy of the log in flash (src/diag/flash_log.cpp)
    -Wl,--wrap=log_printf

; Host-side unit tests for the protocol layer:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<voltra/voltra_protocol.cpp>
build_flags =
    -std=gnu++17
    -Isrc

[env:watch206]
extends = env:remote
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
lib_deps =
    lvgl/lvgl@^8.4.0
    h2zero/NimBLE-Arduino@^2.2.0
    moononournation/GFX Library for Arduino@1.6.8
    lewisxhe/XPowersLib@^0.3.0
build_flags =
    ${common.build_flags}
    -DWATCH206=1
    ; Release: no log output over serial, as env:remote
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

; Watch 2.06 diagnostic build (see env:remote_diag):  pio run -e watch206_diag -t upload
[env:watch206_diag]
extends = env:watch206
build_flags =
    ${common.build_flags}
    -DWATCH206=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DVOLTRA_DIAG=1
    ; log traffic without the register sweep, which has coincided with dropped links
    -DVOLTRA_DIAG_SWEEP=0
    ; keep a copy of the log in flash (src/diag/flash_log.cpp)
    -Wl,--wrap=log_printf

; Watch 2.06 register sweep: the diagnostic build plus a full read of every known
; register every ~40 s, for diffing device states (e.g. twinned vs not). The sweep has
; coincided with dropped links, so use it only for captures.
;   pio run -e watch206_sweep -t upload
[env:watch206_sweep]
extends = env:watch206
build_flags =
    ${common.build_flags}
    -DWATCH206=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DVOLTRA_DIAG=1
    -Wl,--wrap=log_printf
